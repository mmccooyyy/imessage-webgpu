<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>iMessage</title>
    <!-- trunk links the chat-client wasm here. The canvas owns the
         conversation surface; the DOM overlay owns nav bar / input / send
         (spec art_d3wTgg6t §5). -->
    <link data-trunk rel="rust" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
      }
      #app {
        display: block;
        width: 100%;
        height: 100%;
      }
      #overlay {
        position: fixed;
        inset: auto 0 0 0;
        padding: 8px 16px;
        font: 14px/1.4 system-ui, sans-serif;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <canvas id="app" aria-label="conversation canvas"></canvas>
    <div id="overlay"></div>
  </body>
</html>
