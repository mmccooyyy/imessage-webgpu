[package]
name = "chat-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Browser shell: wgpu + glyphon renderer boot, web-sys glue, DOM overlay entry"

[dependencies]
chat-protocol = { workspace = true }
chat-core = { workspace = true }
serde_json = { workspace = true }
wgpu = { workspace = true }
glyphon = { workspace = true }
cosmic-text = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "EventTarget",
    "Event",
    "WheelEvent",
    "KeyboardEvent",
    "MediaQueryList",
    "Location",
    "HtmlInputElement",
    "HtmlButtonElement",
    "CssStyleDeclaration",
    "Performance",
] }
gloo-net = { workspace = true }
uuid = { workspace = true }
# StreamExt::split / SinkExt::send for the gloo-net websocket (gloo-net does
# not re-export the futures traits). Shell-only; protocol/core stay futures-free.
futures = { version = "0.3", default-features = false, features = ["std"] }
console_error_panic_hook = { workspace = true }
log = { workspace = true }
wasm-logger = { workspace = true }
web-time = { workspace = true }

# Native test-only: parse the WGSL shaders with the same naga the runtime
# uses. The browser WebGPU backend compiles shaders lazily — a broken shader
# there degrades to silent no-op draws, so CI catches it by parsing here.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }

# The WebGPU and WebGL2 wasm builds are separate feature sets of this crate
# (wgpu 30's `webgpu`/`webgl` features, verified against its manifest):
#   trunk build                                          → WebGPU bundle
#   trunk build --no-default-features --features webgl   → WebGL2 fallback
# The two never combine: CI builds each with the other disabled.
[features]
default = ["webgpu"]
webgpu = ["wgpu/webgpu"]
webgl = ["wgpu/webgl"]
